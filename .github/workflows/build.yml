name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang kebutuhan sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential

      - name: Pasang buildozer
        run: |
          python -m pip install --upgrade pip wheel "setuptools<81"
          pip install buildozer "cython==0.29.37"

      - name: Build APK
        run: buildozer -v android debug > build.log 2>&1

      - name: Tampilkan penyebab error
        if: failure()
        run: |
          LN=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          LN=${LN:-$(wc -l < build.log)}
          START=$((LN-80))
          if [ "$START" -lt 1 ]; then START=1; fi
          sed -n "${START},$((LN-1))p" build.log

      - name: Simpan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGA-BKKBN-apk
          path: bin/*.apk
          if-no-files-found: error
